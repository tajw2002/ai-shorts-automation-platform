# =============================================================================
# Cloud Build pipeline
# =============================================================================
# Order is deliberate: everything that can fail cheaply runs before anything is
# built, and nothing is deployed until the migration has succeeded — a revision
# that boots against an un-migrated schema fails every request.
#
# Trigger with:
#   gcloud builds submit --config infra/cloudbuild/cloudbuild.yaml \
#     --substitutions _REGION=europe-west1,_ENVIRONMENT=prod
# =============================================================================

substitutions:
  _REGION: europe-west1
  _ENVIRONMENT: prod
  _REPOSITORY: shorts
  # Overridden per environment; the Cloud SQL connection name.
  _SQL_INSTANCE: ''

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:latest'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$SHORT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:latest'

steps:
  # ---------------------------------------------------------------------------
  # 1. Verify. Cheap and fast, so it runs first.
  # ---------------------------------------------------------------------------
  - id: install
    name: node:22
    entrypoint: npm
    args: ['ci']

  - id: build-contracts
    name: node:22
    entrypoint: npm
    args: ['run', 'build', '--workspace', '@shorts/contracts']
    waitFor: ['install']

  - id: lint
    name: node:22
    entrypoint: npm
    args: ['run', 'lint']
    waitFor: ['build-contracts']

  - id: typecheck
    name: node:22
    entrypoint: npm
    args: ['run', 'typecheck']
    waitFor: ['build-contracts']

  # Tests run with DRY_RUN and mock providers, so no paid API is ever called
  # from CI.
  - id: test
    name: node:22
    entrypoint: npm
    args: ['test']
    env:
      - 'NODE_ENV=test'
      - 'DRY_RUN=true'
    waitFor: ['build-contracts']

  # ---------------------------------------------------------------------------
  # 2. Build images, in parallel, only once verification passed.
  # ---------------------------------------------------------------------------
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-f'
      - apps/api/Dockerfile
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:latest'
      - '.'
    waitFor: ['lint', 'typecheck', 'test']

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - '-f'
      - apps/web/Dockerfile
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:latest'
      - '.'
    waitFor: ['lint', 'typecheck', 'test']

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api']
    waitFor: ['build-api']

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web']
    waitFor: ['build-web']

  # ---------------------------------------------------------------------------
  # 3. Migrate before deploying.
  #
  # `prisma migrate deploy` only applies migrations that already exist and never
  # generates or resets — the only migration command safe to run unattended.
  # ---------------------------------------------------------------------------
  - id: migrate
    name: '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        echo "Applying database migrations…"
        cd /app/apps/api
        npx prisma migrate deploy
    secretEnv: ['DATABASE_URL']
    waitFor: ['push-api']

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - 'shorts-${_ENVIRONMENT}-api'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/api:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--quiet'
    waitFor: ['migrate']

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - 'shorts-${_ENVIRONMENT}-web'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/web:$SHORT_SHA'
      - '--region=${_REGION}'
      - '--quiet'
    waitFor: ['deploy-api']

  # ---------------------------------------------------------------------------
  # 4. Confirm the new revision is actually serving.
  # ---------------------------------------------------------------------------
  - id: smoke-test
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        URL=$(gcloud run services describe "shorts-${_ENVIRONMENT}-api" \
          --region "${_REGION}" --format='value(status.url)')
        echo "Probing $$URL/liveness"
        for attempt in 1 2 3 4 5; do
          if curl -sf -H "Authorization: Bearer $(gcloud auth print-identity-token)" \
               "$$URL/liveness" > /dev/null; then
            echo "API is live."
            exit 0
          fi
          echo "Attempt $$attempt failed; retrying in 10s."
          sleep 10
        done
        echo "The deployed revision never became healthy." >&2
        exit 1
    waitFor: ['deploy-api']

availableSecrets:
  secretManager:
    - versionName: 'projects/$PROJECT_ID/secrets/shorts-${_ENVIRONMENT}-database-url/versions/latest'
      env: DATABASE_URL

timeout: 2400s
