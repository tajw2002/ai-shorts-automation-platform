<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e10600"/>
      <stop offset="1" stop-color="#7a0306"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="#0b0b0b"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <polygon points="0,0 360,0 260,300 0,300" fill="url(#fade)"/>
  <polygon points="360,0 384,0 284,300 260,300" fill="#0b0b0b"/>

  <!-- Hochkant-Bildschirm mit Play-Symbol -->
  <rect x="92" y="58" width="104" height="184" rx="16" fill="#0b0b0b" stroke="#ffffff" stroke-width="4"/>
  <rect x="128" y="70" width="32" height="5" rx="2.5" fill="#ffffff"/>
  <polygon points="128,122 128,178 174,150" fill="#ffffff"/>

  <text x="420" y="128" fill="#ffffff" font-size="54" font-weight="700">AI Shorts Automation Platform</text>
  <text x="422" y="176" fill="#bdbdbd" font-size="26">Automatisierte YouTube Shorts, von der Idee bis zum Upload</text>

  <g font-size="17" font-weight="600">
    <rect x="422" y="214" width="150" height="36" rx="18" fill="none" stroke="#e10600" stroke-width="2"/>
    <text x="497" y="238" fill="#ffffff" text-anchor="middle">TypeScript</text>
    <rect x="586" y="214" width="122" height="36" rx="18" fill="none" stroke="#e10600" stroke-width="2"/>
    <text x="647" y="238" fill="#ffffff" text-anchor="middle">NestJS</text>
    <rect x="722" y="214" width="122" height="36" rx="18" fill="none" stroke="#e10600" stroke-width="2"/>
    <text x="783" y="238" fill="#ffffff" text-anchor="middle">Next.js</text>
    <rect x="858" y="214" width="138" height="36" rx="18" fill="none" stroke="#e10600" stroke-width="2"/>
    <text x="927" y="238" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
    <rect x="1010" y="214" width="112" height="36" rx="18" fill="none" stroke="#e10600" stroke-width="2"/>
    <text x="1066" y="238" fill="#ffffff" text-anchor="middle">FFmpeg</text>
  </g>
</svg>
